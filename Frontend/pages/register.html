<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrace – Dokumentka</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-body">

<nav class="navbar">
    <div class="nav-container">
        <a href="../index.html" class="nav-logo">
            <i class="fas fa-file-alt"></i>
            <span>Dokumentka</span>
        </a>
    </div>
</nav>

<div class="auth-container">

    <!-- Dekorativní karty -->
    <div class="auth-decorations">
        <div class="auth-decoration-card">
            <i class="fas fa-file-invoice"></i>
            <span>Faktura_2024.pdf</span>
        </div>
        <div class="auth-decoration-card">
            <i class="fas fa-file-contract"></i>
            <span>Pracovní smlouva</span>
        </div>
        <div class="auth-decoration-card">
            <i class="fas fa-shield-alt"></i>
            <span>Zabezpečeno JWT</span>
        </div>
        <div class="auth-decoration-card">
            <i class="fas fa-file-medical"></i>
            <span>Pojištění auta</span>
        </div>
    </div>

    <div class="auth-right">
        <div class="auth-card">
            <h1>Vytvořit účet</h1>
            <p class="auth-subtitle">Již máte účet? <a href="login.html">Přihlaste se</a></p>

            <div id="error-message" class="alert alert-error" style="display:none"></div>
            <div id="success-message" class="alert alert-success" style="display:none"></div>

            <form id="register-form">
                <div class="form-group">
                    <label>Uživatelské jméno</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username"
                               placeholder="Zadejte uživatelské jméno" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email"
                               placeholder="Zadejte váš email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Heslo</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password"
                               placeholder="Minimálně 6 znaků" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password', 'eye-icon-1')">
                            <i class="fas fa-eye" id="eye-icon-1"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Heslo znovu</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password-confirm"
                               placeholder="Zadejte heslo znovu" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password-confirm', 'eye-icon-2')">
                            <i class="fas fa-eye" id="eye-icon-2"></i>
                        </button>
                    </div>
                </div>
                <div class="form-terms">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" required>
                        Souhlasím s <a href="terms.html">podmínkami použití</a>
                    </label>
                </div>
                <button type="submit" class="btn-primary btn-full" id="submit-btn">
                    Vytvořit účet zdarma
                </button>
            </form>
        </div>
    </div>
</div>

<script src="../js/auth.js"></script>
</body>
</html>
