<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení – Dokumentka</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-body">

<nav class="navbar">
    <div class="nav-container">
        <a href="../index.html" class="nav-logo">
            <i class="fas fa-file-alt"></i>
            <span>Dokumentka</span>
        </a>
    </div>
</nav>

<div class="auth-container">
    <!-- Dekorativní karty -->
    <div class="auth-decorations">
        <div class="auth-decoration-card">
            <i class="fas fa-file-invoice"></i>
            <span>Faktura_2024.pdf</span>
        </div>
        <div class="auth-decoration-card">
            <i class="fas fa-file-contract"></i>
            <span>Pracovní smlouva</span>
        </div>
        <div class="auth-decoration-card">
            <i class="fas fa-shield-alt"></i>
            <span>Zabezpečeno JWT</span>
        </div>
        <div class="auth-decoration-card">
            <i class="fas fa-file-medical"></i>
            <span>Pojištění auta</span>
        </div>
    </div>
    <div class="auth-right">
        <div class="auth-card">
            <h1>Přihlásit se</h1>
            <p class="auth-subtitle">Nemáte účet? <a href="register.html">Zaregistrujte se zdarma</a></p>

            <div id="error-message" class="alert alert-error" style="display:none"></div>

            <form id="login-form">
                <div class="form-group">
                    <label>Uživatelské jméno nebo email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="usernameOrEmail"
                               placeholder="Zadejte jméno nebo email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Heslo</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password"
                               placeholder="Zadejte heslo" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox"> Zapamatovat si mě
                    </label>
                    <a href="#" class="forgot-password" onclick="forgotPassword()">
                        Zapomněli jste heslo?
                    </a>
                </div>
                <button type="submit" class="btn-primary btn-full" id="submit-btn">
                    Přihlásit se
                </button>
            </form>
        </div>
    </div>
</div>

<script src="../js/auth.js"></script>
</body>
</html>
